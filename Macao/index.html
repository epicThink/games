<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #2d6a2d;
      display: flex;
      flex-direction: column;
      font-family: Georgia, serif;
    }

    /* ── ROWS ──────────────────────────────────────────── */

    #opponent-row {
      width: 100%;
      height: 25%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #opponent-count {
      color: #d4edda;
      font-size: 0.85rem;
    }

    #opponent-hand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #play-area {
      width: 100%;
      height: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      position: relative;
    }

    #player-row {
      width: 100%;
      height: 25%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #player-hand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ── CARDS ─────────────────────────────────────────── */

    .card {
      width: 65px;
      height: 130px;
      border: 2px solid black;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 900;
      color: white;
      user-select: none;
      flex-shrink: 0;
      transition: transform 0.15s ease, outline 0.1s ease;
    }

    .card         { background: #ffffff; }
    .card.red     { color: #c0392b; }
    .card.black   { color: #1c1c1c; }
    .card.hidden  { background: #7f8c8d; color: #7f8c8d; }

    .card.playable {
      outline: 3px solid gold;
      cursor: pointer;
    }

    .card.playable:hover {
      transform: translateY(-10px);
    }

    .card.selected {
      outline: 3px solid #00d4ff;
      transform: translateY(-14px);
    }

    /* ── PLAY AREA ELEMENTS ────────────────────────────── */

    .pile-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #d4edda;
      font-size: 0.8rem;
    }

    /* Horizontal queue of up to 5 pile cards, oldest → newest (left → right) */
    #pile-display {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }

    #draw-pile-card {
      cursor: pointer;
    }

    #draw-pile-card:hover {
      outline: 2px solid white;
    }

    #active-suit-indicator {
      position: absolute;
      bottom: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      background: rgba(0,0,0,0.45);
      padding: 4px 14px;
      border-radius: 20px;
      display: none;
      color: white;
    }

    #punishment-banner {
      position: absolute;
      bottom: 10px;
      background: #c0392b;
      color: white;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      display: none;
    }

    /* ── STATUS BAR ────────────────────────────────────── */

    #status-bar {
      position: fixed;
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      padding: 4px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      pointer-events: none;
      white-space: nowrap;
      z-index: 5;
    }

    /* ── CONFIRM BUTTON ────────────────────────────────── */

    #confirm-play {
      display: none;
      background: #f39c12;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 0.9rem;
      font-weight: bold;
      padding: 6px 20px;
      cursor: pointer;
      font-family: Georgia, serif;
    }

    #confirm-play:hover { background: #e67e22; }

    /* ── SUIT PICKER OVERLAY ───────────────────────────── */

    #suit-picker {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
    }

    #suit-picker h2 {
      color: white;
      font-size: 1.2rem;
    }

    #suit-picker-buttons {
      display: flex;
      gap: 16px;
    }

    #suit-picker button {
      width: 65px;
      height: 130px;
      border: 2px solid black;
      border-radius: 10px;
      font-size: 2.2rem;
      cursor: pointer;
      font-weight: 900;
      color: white;
      transition: outline 0.1s ease;
    }

    #suit-picker button { background: #ffffff; }
    #suit-picker button[data-suit="hearts"],
    #suit-picker button[data-suit="diamonds"] { color: #c0392b; }
    #suit-picker button[data-suit="clubs"],
    #suit-picker button[data-suit="spades"]   { color: #1c1c1c; }

    #suit-picker button:hover { outline: 3px solid gold; }

    /* ── GAME OVER SCREEN ──────────────────────────────── */

    #game-over {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 20;
    }

    #game-over-message {
      color: gold;
      font-size: 2.5rem;
      font-weight: bold;
    }

    #restart-btn {
      background: #27ae60;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 30px;
      cursor: pointer;
      font-family: Georgia, serif;
    }

    #restart-btn:hover { background: #2ecc71; }
  </style>
</head>
<body>

  <!-- ── TOP ROW: Opponent ───────────────────────────── -->
  <div id="opponent-row">
    <div id="opponent-hand"></div>
    <span id="opponent-count"></span>
  </div>

  <!-- ── MIDDLE ROW: Play area ───────────────────────── -->
  <div id="play-area">
    <span id="active-suit-indicator"></span>

    <div class="pile-slot">
      <div class="card hidden" id="draw-pile-card"></div>
      <span id="draw-pile-count"></span>
    </div>

    <div class="pile-slot">
      <div id="pile-display"></div>
      <span>Play pile</span>
    </div>

    <span id="punishment-banner"></span>
  </div>

  <!-- ── BOTTOM ROW: Player ──────────────────────────── -->
  <div id="player-row">
    <div id="player-hand"></div>
    <button id="confirm-play"></button>
  </div>

  <!-- ── STATUS BAR ──────────────────────────────────── -->
  <div id="status-bar"></div>

  <!-- ── SUIT PICKER OVERLAY ─────────────────────────── -->
  <div id="suit-picker">
    <h2>Choose a suit</h2>
    <div id="suit-picker-buttons">
      <button data-suit="hearts">♥</button>
      <button data-suit="diamonds">♦</button>
      <button data-suit="clubs">♣</button>
      <button data-suit="spades">♠</button>
    </div>
  </div>

  <!-- ── GAME OVER SCREEN ────────────────────────────── -->
  <div id="game-over">
    <div id="game-over-message"></div>
    <button id="restart-btn">Play Again</button>
  </div>

  <!-- ── SCRIPTS: order matters ──────────────────────── -->
  <!-- 1. Card class + deck helpers (no DOM dependency)  -->
  <script src="card.js"></script>
  <!-- 2. Pure rendering functions (uses Card, touches DOM) -->
  <script src="render.js"></script>
  <!-- 3. Card animation helpers (uses Card, reads DOM) -->
  <script src="animate.js"></script>
  <!-- 4. Game logic, AI, event handlers, init (uses all above) -->
  <script src="script.js"></script>

</body>
</html>
