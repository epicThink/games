<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Game</title>
  <style>
    /* ── CSS VARIABLES ─────────────────────────────────────
       Card size scales with the narrowest viewport dimension.
       On a 390px-wide phone: card ≈ 48px × 96px
       On a 1440px desktop:   card ≈ 72px × 144px
       clamp(min, preferred, max)
    ──────────────────────────────────────────────────────── */
    :root {
      --card-w: clamp(42px, 10vmin, 72px);
      --card-h: calc(var(--card-w) * 2);
      --card-font: calc(var(--card-w) * 0.62);
      --card-radius: calc(var(--card-w) * 0.15);
      --gap-sm: clamp(4px, 1vmin, 10px);
      --gap-md: clamp(8px, 2vmin, 20px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      /* Use dvh (dynamic viewport height) so mobile browser chrome doesn't crop */
      min-height: 100dvh;
    }

    body {
      background: #2d6a2d;
      display: flex;
      flex-direction: column;
      font-family: Georgia, serif;
      overflow: hidden;
      touch-action: manipulation; /* prevent double-tap zoom on mobile */
    }

    /* ── ROWS ──────────────────────────────────────────── */

    #opponent-row {
      width: 100%;
      height: 25%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--gap-sm);
      padding: 0 var(--gap-sm);
    }

    #opponent-count {
      color: #d4edda;
      font-size: clamp(0.65rem, 2vmin, 0.9rem);
    }

    #opponent-hand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--gap-sm);
      flex-wrap: nowrap;
      max-width: 100%;
      overflow: hidden; /* hide any overflow rather than push layout */
    }

    #play-area {
      width: 100%;
      height: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 5vw, 50px);
      position: relative;
      padding: 0 var(--gap-sm);
    }

    #player-row {
      width: 100%;
      height: 25%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--gap-sm);
      padding: 0 var(--gap-sm);
    }

    #player-hand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--gap-sm);
      flex-wrap: wrap;
      max-width: 100%;
    }

    /* ── CARDS ─────────────────────────────────────────── */

    .card {
      width: var(--card-w);
      height: var(--card-h);
      border: 2px solid black;
      border-radius: var(--card-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--card-font);
      font-weight: 900;
      user-select: none;
      flex-shrink: 0;
      transition: transform 0.15s ease, outline 0.1s ease;
      /* Ensure text never overflows narrow cards */
      overflow: hidden;
      line-height: 1;
    }

    .card         { background: #ffffff; color: #1c1c1c; }
    .card.red     { color: #c0392b; }
    .card.black   { color: #1c1c1c; }
    .card.hidden  { background: #7f8c8d; color: #7f8c8d; }

    .card.playable {
      outline: 3px solid gold;
      cursor: pointer;
    }

    /* Use active state for touch devices instead of hover */
    .card.playable:hover,
    .card.playable:active {
      transform: translateY(calc(var(--card-h) * -0.08));
    }

    .card.selected {
      outline: 3px solid #00d4ff;
      transform: translateY(calc(var(--card-h) * -0.11));
    }

    /* ── PLAY AREA ELEMENTS ────────────────────────────── */

    .pile-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--gap-sm);
      color: #d4edda;
      font-size: clamp(0.65rem, 2vmin, 0.85rem);
      min-width: 0; /* allow shrink */
    }

    #pile-display {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--gap-sm);
    }

    #draw-pile-card {
      cursor: pointer;
    }

    #draw-pile-card:hover,
    #draw-pile-card:active {
      outline: 2px solid white;
    }

    #active-suit-indicator {
      position: absolute;
      bottom: clamp(6px, 1.5vmin, 12px);
      font-size: clamp(0.75rem, 2.5vmin, 1.1rem);
      font-weight: bold;
      background: rgba(0,0,0,0.45);
      padding: 3px 12px;
      border-radius: 20px;
      display: none;
      color: white;
      white-space: nowrap;
    }

    #punishment-banner {
      position: absolute;
      bottom: clamp(6px, 1.5vmin, 12px);
      background: #c0392b;
      color: white;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: clamp(0.7rem, 2.2vmin, 0.9rem);
      font-weight: bold;
      display: none;
      white-space: nowrap;
      max-width: 90%;
      text-align: center;
    }

    /* ── STATUS BAR ────────────────────────────────────── */

    #status-bar {
      position: fixed;
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      padding: 3px 16px;
      border-radius: 20px;
      font-size: clamp(0.65rem, 2vmin, 0.85rem);
      pointer-events: none;
      white-space: nowrap;
      z-index: 5;
      max-width: 90vw;
      text-align: center;
    }

    /* ── CONFIRM BUTTON ────────────────────────────────── */

    #confirm-play-wrapper {
      width: 100%;
      height: 0;           /* takes no space in the flow */
      position: relative;
      z-index: 6;
      display: flex;
      justify-content: center;
    }

    #confirm-play {
      display: none;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #f39c12;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: clamp(0.75rem, 2.5vmin, 0.95rem);
      font-weight: bold;
      padding: clamp(5px, 1.5vmin, 8px) clamp(12px, 3vmin, 22px);
      cursor: pointer;
      font-family: Georgia, serif;
      min-height: 36px;
      min-width: 80px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    #confirm-play:hover,
    #confirm-play:active { background: #e67e22; }

    /* ── SUIT PICKER OVERLAY ───────────────────────────── */

    #suit-picker {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--gap-md);
      z-index: 10;
    }

    #suit-picker h2 {
      color: white;
      font-size: clamp(0.9rem, 3vmin, 1.3rem);
    }

    #suit-picker-buttons {
      display: flex;
      gap: var(--gap-md);
    }

    #suit-picker button {
      width: var(--card-w);
      height: var(--card-h);
      border: 2px solid black;
      border-radius: var(--card-radius);
      font-size: var(--card-font);
      cursor: pointer;
      font-weight: 900;
      transition: outline 0.1s ease;
      background: #ffffff;
      /* Accessible tap target */
      min-width: 44px;
      min-height: 44px;
    }

    #suit-picker button[data-suit="hearts"],
    #suit-picker button[data-suit="diamonds"] { color: #c0392b; }
    #suit-picker button[data-suit="clubs"],
    #suit-picker button[data-suit="spades"]   { color: #1c1c1c; }

    #suit-picker button:hover,
    #suit-picker button:active { outline: 3px solid gold; }

    /* ── GAME OVER SCREEN ──────────────────────────────── */

    #game-over {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--gap-md);
      z-index: 20;
    }

    #game-over-message {
      color: gold;
      font-size: clamp(1.5rem, 6vmin, 2.5rem);
      font-weight: bold;
      text-align: center;
      padding: 0 1rem;
    }

    #restart-btn {
      background: #27ae60;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: clamp(0.85rem, 2.5vmin, 1rem);
      font-weight: bold;
      padding: clamp(8px, 2vmin, 12px) clamp(20px, 5vmin, 32px);
      cursor: pointer;
      font-family: Georgia, serif;
      min-height: 44px;
    }

    #restart-btn:hover,
    #restart-btn:active { background: #2ecc71; }
  </style>
</head>
<body>

  <!-- ── TOP ROW: Opponent ───────────────────────────── -->
  <div id="opponent-row">
    <div id="opponent-hand"></div>
    <span id="opponent-count"></span>
  </div>

  <!-- ── MIDDLE ROW: Play area ───────────────────────── -->
  <div id="play-area">
    <span id="active-suit-indicator"></span>

    <div class="pile-slot">
      <div class="card hidden" id="draw-pile-card"></div>
      <span id="draw-pile-count"></span>
    </div>

    <div class="pile-slot">
      <div id="pile-display"></div>
      <span>Play pile</span>
    </div>

    <span id="punishment-banner"></span>
  </div>

  <!-- ── CONFIRM PLAY (sits between play area and hand) ── -->
  <div id="confirm-play-wrapper">
    <button id="confirm-play"></button>
  </div>

  <!-- ── BOTTOM ROW: Player ──────────────────────────── -->
  <div id="player-row">
    <div id="player-hand"></div>
  </div>

  <!-- ── STATUS BAR ──────────────────────────────────── -->
  <div id="status-bar"></div>

  <!-- ── SUIT PICKER OVERLAY ─────────────────────────── -->
  <div id="suit-picker">
    <h2>Choose a suit</h2>
    <div id="suit-picker-buttons">
      <button data-suit="hearts">♥</button>
      <button data-suit="diamonds">♦</button>
      <button data-suit="clubs">♣</button>
      <button data-suit="spades">♠</button>
    </div>
  </div>

  <!-- ── GAME OVER SCREEN ────────────────────────────── -->
  <div id="game-over">
    <div id="game-over-message"></div>
    <button id="restart-btn">Play Again</button>
  </div>

  <!-- ── SCRIPTS: order matters ──────────────────────── -->
  <script src="card.js"></script>
  <script src="render.js"></script>
  <script src="animate.js"></script>
  <script src="script.js"></script>

</body>
</html>
